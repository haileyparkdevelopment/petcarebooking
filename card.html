<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daycare Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d2b1a;--mute:#6b5a45;--line:#ece3d0;--pill:#fdf0c4;--yel:#fcc93a;--yel-d:#e7ad12;--green:#4a7c4e;--green-l:#d3ead6;--sum:#e9f3e6}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16.5px/1.5 "Fredoka","Trebuchet MS",sans-serif;
 background:radial-gradient(ellipse at 70% 0,#fff6cf,transparent 60%),linear-gradient(#fde9a0,#fff3c4 40%,#fde9a0);min-height:100vh;position:relative;overflow-x:hidden}
.paw{position:absolute;opacity:.35;font-size:26px;pointer-events:none}
.hand{font-family:"Caveat",cursive;font-size:22px;line-height:1.05;margin:0}
.hero{max-width:760px;margin:0 auto;padding:36px 20px 8px;position:relative}
.hero h1{font:700 clamp(40px,8vw,64px)/1 "Fredoka",sans-serif;margin:8px 0 10px;letter-spacing:-1px}
.lead{margin:0;font-size:20px;color:#4e3a24}
.lead b{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.meta span{background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:500;box-shadow:0 2px 6px rgba(160,120,30,.12)}
.good{position:absolute;right:24px;top:40px;transform:rotate(10deg);text-align:center}
main{max-width:760px;margin:0 auto;padding:12px 16px 30px}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 6px 18px rgba(160,120,30,.12);margin-bottom:20px}
.sec{display:flex;align-items:center;gap:10px;background:var(--pill);border-radius:12px;padding:8px 14px 8px 8px;font:600 20px "Fredoka";margin:0 0 14px}
.sec i{font-style:normal;background:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{border:2px solid #f1e7cf;border-radius:16px;padding:14px 10px;text-align:center}
.stat .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;margin:0 auto 6px}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat .nm{font-weight:500;font-size:15px;color:var(--mute)}
.walk{display:flex;align-items:center;gap:12px;background:var(--sum);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.walk .ic{font-size:28px}
.walk b{display:block;font-weight:600}
.walk small{color:var(--mute);font-size:14.5px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:6px}
.pol{position:relative;background:#fff;padding:8px 8px 12px;box-shadow:0 6px 14px rgba(120,90,20,.18);transition:transform .15s}
.pol:nth-child(odd){transform:rotate(-2deg)}.pol:nth-child(even){transform:rotate(2deg)}
.pol:hover{transform:rotate(0) scale(1.03)}
.pol .open{display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#f7ecd0}
.dl{position:absolute;right:14px;bottom:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;text-decoration:none;font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.dl:focus-visible,.lbdl:focus-visible{outline:2px solid var(--yel-d);outline-offset:2px}
.lbdl{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--yel);color:var(--ink);border-radius:999px;padding:10px 20px;font:600 17px "Fredoka";text-decoration:none;box-shadow:0 3px 0 var(--yel-d)}
.empty{color:var(--mute);font-size:15px;margin:4px 0 0}
.note{background:#fffbe9;border-radius:14px;padding:16px 18px;font-size:17px;white-space:pre-wrap;border:2px dashed #f0d98a}
.sign{text-align:right;margin-top:10px}
#msg{max-width:520px;margin:60px auto;text-align:center}
#lb{position:fixed;inset:0;background:rgba(40,28,15,.88);display:none;place-items:center;z-index:9;cursor:zoom-out;padding:16px}
#lb img{max-width:100%;max-height:92vh;border:8px solid #fff;border-radius:4px}
footer{max-width:760px;margin:0 auto;padding:10px 24px 30px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.good{display:none}.photos{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<span class="paw" style="top:60px;left:6%">🐾</span><span class="paw" style="top:180px;right:8%">🐾</span><span class="paw" style="top:520px;left:3%">🐾</span>

<div id="msg" class="card" hidden></div>

<div id="app" hidden>
<header class="hero">
  <p class="hand">Daily report ♥</p>
  <h1 id="hi"></h1>
  <p class="lead" id="lead"></p>
  <div class="meta" id="meta"></div>
  <p class="hand good">Good<br>Day<br>Today ♡</p>
</header>
<main>
  <section class="card">
    <h2 class="sec"><i>🐾</i>Today's Activity</h2>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card" id="walkSec">
    <h2 class="sec"><i>🦮</i>Walks</h2>
    <div id="walks"></div>
    <div class="photos" id="walkPhotos"></div>
  </section>

  <section class="card">
    <h2 class="sec"><i>📸</i>Photos</h2>
    <div class="photos" id="dogPhotos"></div>
  </section>

  <section class="card" id="noteSec">
    <h2 class="sec"><i>💌</i>Note from your sitter</h2>
    <div class="note" id="note"></div>
    <p class="hand sign">— Hailey 🐾</p>
  </section>
</main>
<footer><span class="hand">Because they're family ♥</span><span>🏠 Pet Care 🐾</span></footer>
</div>

<div id="lb"><img alt=""><a class="lbdl" id="lbdl" download>⬇️ Download photo</a></div>

<script>
/* ===== EDIT THIS PART ===== */
const REPO = { owner: "haileyparkdevelopment", name: "petcarebooking", branch: "main" };
/* ========================= */

const $ = id => document.getElementById(id);
const IMG = /\.(jpe?g|png|gif|webp|avif)$/i;
const STATS = [
  {k:"pee",   nm:"Pee",   ic:"💧", bg:"#fff1b8"},
  {k:"poo",   nm:"Poo",   ic:"💩", bg:"#f3e0c9"},
  {k:"food",  nm:"Food",  ic:"🍖", bg:"#ffe0cc"},
  {k:"water", nm:"Water", ic:"🥣", bg:"#dcefff"}
];
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const list = v => Array.isArray(v) ? v : (typeof v === "number" ? Array(v).fill("") : []);

function showMsg(html){ $("msg").innerHTML = html; $("msg").hidden = false; }

function fmtDate(s){
  if (!s) return "";
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-CA", {weekday:"long", month:"long", day:"numeric"});
}

// "08:30" -> "8:30 AM" (anything else is shown as written)
function fmtTime(t){
  const m = /^(\d{1,2}):(\d{2})$/.exec(t || "");
  if (!m) return t;
  const h = +m[1];
  return `${h % 12 || 12}:${m[2]} ${h < 12 ? "AM" : "PM"}`;
}

// Lists image files in a repo folder via the GitHub API, so photos added to the folder show up automatically.
async function folderImages(path){
  try {
    const url = location.hostname === "localhost"
      ? `/__gh/${path}`   // local testing only
      : `https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/${path}?ref=${REPO.branch}`;
    const r = await fetch(url);
    if (!r.ok) return [];
    const files = await r.json();
    return files.filter(f => f.type === "file" && IMG.test(f.name))
                .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}))
                .map(f => `${path}/${f.name}`);
  } catch { return []; }
}

// Download name: "Misa-2026-11-19-1.jpg" (walk photos: "Misa-2026-11-19-walk-1.jpg")
const fileName = (prefix, i, src) => `${prefix}-${i + 1}${(src.match(/\.[a-z0-9]+$/i) || [".jpg"])[0].toLowerCase()}`;

function photos(box, srcs, emptyText, prefix){
  box.innerHTML = "";
  if (!srcs.length){ box.replaceWith(Object.assign(el("p","empty",emptyText), {id: box.id})); return; }
  srcs.forEach((src, i) => {
    const name = fileName(prefix, i, src);
    const card = el("div","pol");
    const b = el("button","open"); b.type = "button"; b.setAttribute("aria-label", "View photo " + (i + 1));
    const img = el("img"); img.src = src; img.alt = ""; img.loading = "lazy";
    b.appendChild(img); b.onclick = () => openLb(src, name);
    const a = el("a","dl","⬇️"); a.href = src; a.download = name; a.title = "Download"; a.setAttribute("aria-label", "Download " + name);
    card.append(b, a); box.appendChild(card);
  });
}

function openLb(src, name){
  $("lb").querySelector("img").src = src;
  $("lbdl").href = src; $("lbdl").download = name;
  $("lb").style.display = "grid";
}
$("lbdl").onclick = e => e.stopPropagation();
$("lb").onclick = () => $("lb").style.display = "none";
document.addEventListener("keydown", e => { if (e.key === "Escape") $("lb").style.display = "none"; });

function render(d, walkSrcs, dogSrcs){
  document.title = `${d.dog}'s Daycare Card`;
  $("hi").textContent = `Hi ${d.client}! 👋`;
  $("lead").innerHTML = "";
  $("lead").append("This is ", el("b", null, `${d.dog}'s`), " daycare card 🐶");
  const meta = $("meta");
  if (d.date) meta.appendChild(el("span", null, "📅 " + fmtDate(d.date)));
  if (d.dropoff) meta.appendChild(el("span", null, "☀️ Drop-off " + fmtTime(d.dropoff)));
  if (d.pickup) meta.appendChild(el("span", null, "🏠 Pick-up " + fmtTime(d.pickup)));

  STATS.forEach(s => {
    const items = list(d[s.k]);
    const box = el("div","stat");
    const ic = el("div","ic", s.ic); ic.style.background = s.bg;
    box.append(ic, el("b", null, items.length), el("span","nm", s.nm));
    $("stats").appendChild(box);
  });

  const walks = Array.isArray(d.walks) ? d.walks : [];
  walks.forEach(w => {
    const row = el("div","walk");
    const bits = [w.minutes && `${w.minutes} min`, w.km && `${w.km} km`].filter(Boolean).join(" · ");
    const tx = el("div"); tx.append(el("b", null, w.time ? `Walk at ${fmtTime(w.time)}` : "Walk"), el("small", null, bits));
    row.append(el("span","ic","🦮"), tx);
    $("walks").appendChild(row);
  });
  const prefix = [String(d.dog || "photo").trim().replace(/[^\p{L}\p{N}]+/gu, "-"), d.date].filter(Boolean).join("-");
  if (!walks.length && !walkSrcs.length) $("walkSec").hidden = true;
  else photos($("walkPhotos"), walkSrcs, "", prefix + "-walk");

  photos($("dogPhotos"), dogSrcs, "Photos coming soon! 📷", prefix);

  if (d.note && d.note.trim()) $("note").textContent = d.note; else $("noteSec").hidden = true;
  $("app").hidden = false;
}

(async () => {
  const q = new URLSearchParams(location.search);
  // ?draft=1 previews what you're filling in on maker.html (same browser only)
  if (q.has("draft")){
    let d = null; try { d = JSON.parse(localStorage.getItem("cardDraft")); } catch {}
    if (!d) return showMsg("<h2>No draft yet</h2><p>Fill in a card on maker.html first.</p>");
    return render(d, [], []);
  }
  const id = (q.get("c") || "").replace(/[^a-zA-Z0-9_-]/g, "");
  if (!id) return showMsg("<h2>🐾 Oops!</h2><p>This link is missing its card. Please use the link I sent you.</p>");
  const base = `cards/${id}`;
  let d;
  try {
    const r = await fetch(`${base}/info.json`, {cache: "no-store"});
    if (!r.ok) throw 0;
    d = await r.json();
  } catch { return showMsg("<h2>🐾 Card not found</h2><p>This card might not be ready yet. Try again in a minute!</p>"); }
  const [walkSrcs, dogSrcs] = await Promise.all([folderImages(`${base}/walk`), folderImages(`${base}/photos`)]);
  render(d, walkSrcs, dogSrcs);
})();
</script>
</body>
</html>
